services:
  nginx:
    image: nginx:1.25-alpine
    platform: linux/amd64
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.04"
          memory: "30MB"
    networks:
      - rinha

  api1:
    build: .
    platform: linux/amd64
    environment:
      - MODE=api
    deploy:
      resources:
        limits:
          cpus: "0.48"
          memory: "160MB"
    networks:
      - rinha

  api2:
    build: .
    platform: linux/amd64
    environment:
      - MODE=api
    deploy:
      resources:
        limits:
          cpus: "0.48"
          memory: "160MB"
    networks:
      - rinha

networks:
  rinha:
    driver: bridge
